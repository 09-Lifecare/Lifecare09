<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeCare | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <h1>LifeCare</h1>
        <p>Stay healthy. Stay organized. Stay prepared. Stay in control.</p>
        <button onclick="window.location.href='login.html'">Get Started</button>
    </div>

    <div class="login-container">
        <h2 class="login-heading">Login to LifeCare</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Enter Email" required>
            <input type="password" id="password" placeholder="Enter Password" required>
            <select id="role" required>
                <option value="" disabled selected>Select Your Role</option>
                <option value="nursingStudent">Nursing Student</option>
                <option value="student">Student</option>
                <option value="Professional">Other Professional</option>
            </select>
            <button type="submit">Login</button>
        </form>
        <p id="error-message" style="color:red;"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
